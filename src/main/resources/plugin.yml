name: LevelPvP
version: '${version}'
main: de.levelpvp.LevelPvPPlugin
api-version: '26.2'
author: LevelPvP
description: Level-, PvP-, XP- und Spezialitem-System für Paper 26.2.
commands:
  stats:
    description: Öffnet deine PvP-Statistik.
    usage: /stats
  pvpmod:
    description: Administrationsbefehle für LevelPvP.
    usage: /pvpmod <reload|setlevel|addlevel|removelevel|stats|unban|reset|mace>
permissions:
  levelpvp.admin:
    description: Erlaubt alle LevelPvP-Administrationsbefehle.
    default: op
